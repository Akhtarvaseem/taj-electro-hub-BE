# ===== Server =====
server.port=${PORT:8080}


# ===== PostgreSQL Datasource =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/electrohub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ElectroHubTajElectricSuperSecretKeyChangeMeInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}


# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://taj-electro-hub-fe.vercel.app,http://localhost:5173,http://localhost}


# ===== File Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB