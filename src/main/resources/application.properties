# ===== Server =====
server.port=8080

# ===== PostgreSQL Datasource (env-var driven, with local fallbacks) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/electrohub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ElectroHubTajElectricSuperSecretKeyChangeMeInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# ===== CORS (React frontend origin) =====
app.cors.allowed-origins=${CORS_ORIGINS:https://taj-electro-hub-fe.vercel.app,http://localhost:5173,http://localhost}

# Allow profile-picture payloads (resized client-side, still can be a few hundred KB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB
